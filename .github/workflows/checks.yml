name: Correctness and fixture reproduction
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python evaluate.py --output local-output/ci
      - run: python evaluate_workbench.py --output local-output/ci-workbench
